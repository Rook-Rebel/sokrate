<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>Kapanadze AI Socrates — English Research Demonstrator</title>
<style>
:root{--ink:#1a2c48;--muted:#566781;--blue:#244aa5;--line:#dae1ed;--paper:#f5f8fc;--white:#fff;--light:#ecf2ff;--good:#146c49;--warn:#955c04}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--ink);background:linear-gradient(90deg,#fff 0%,#f7f9fe 100%);line-height:1.55;margin:0}
main,.top{max-width:960px;margin:auto;padding:18px 18px 40px}.top{padding-top:24px;padding-bottom:6px}.title{font-size:clamp(22px,4vw,30px);font-family:Georgia,serif;font-weight:700;line-height:1.2}.sub{color:var(--muted);font-size:14px;margin-top:6px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{border:1px solid var(--line);background:var(--white);padding:9px 15px;border-radius:24px;cursor:pointer;font-weight:600;color:var(--ink)}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:var(--white);border:1px solid var(--line);padding:clamp(17px,4vw,27px);border-radius:14px;box-shadow:0 5px 24px #213c6a09;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.topic{border:1px solid var(--line);background:var(--paper);padding:18px;border-radius:11px;text-align:left;cursor:pointer;color:var(--ink);display:block;width:100%;min-height:100px}.topic:hover,.topic:focus-visible{border-color:var(--blue)}.topic strong{display:block;font-size:17px}.topic span{font-size:13px;color:var(--muted)}
h2{font:700 24px Georgia,serif;margin:4px 0 10px}h3{font:700 18px Georgia,serif;margin:17px 0 9px}p{margin:8px 0}label{font-weight:600;font-size:13px;display:block;margin:11px 0 5px}input,select,textarea{font:inherit;border:1px solid #b9c6dd;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);width:100%}textarea{min-height:110px;resize:vertical}.btn{display:inline-block;border:1px solid var(--blue);border-radius:9px;color:var(--blue);background:white;font-size:15px;font-weight:650;padding:10px 16px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.soft{border-color:var(--line);color:var(--muted)}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.note{border-left:3px solid var(--blue);background:var(--light);padding:11px 14px;border-radius:3px 9px 9px 3px;margin:10px 0;font-size:14px}.caution{border-left-color:#b47713;background:#fff6e7}.small{font-size:13px;color:var(--muted)}.pill{border:1px solid var(--line);padding:4px 9px;border-radius:20px;background:var(--paper);font-size:12px;font-weight:600}.meter{height:6px;background:#dde6f4;border-radius:5px;overflow:hidden;margin:12px 0}.meter>i{display:block;background:var(--blue);height:100%;transition:width .3s}.question{font:500 clamp(19px,3.2vw,24px) Georgia,serif;line-height:1.45;margin:16px 0}
.conf{display:flex;gap:6px;flex-wrap:wrap}.conf label{border:1px solid var(--line);font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer;margin:0}.conf label:has(input:checked){background:var(--light);border-color:var(--blue)}.conf input{width:auto;margin-right:5px}.message{font-size:14px;margin-top:12px;min-height:19px}.success{color:var(--good)}.warn{color:var(--warn)}.hints{border:1px solid #e7d0a5;background:#fffaf1;border-radius:9px;padding:12px 15px;margin:13px 0}.hints b{color:#754b0a}details{margin:10px 0;border:1px solid var(--line);padding:11px 14px;border-radius:9px;background:#fbfcff}summary{cursor:pointer;font-weight:600}.theory{font-size:15px}.eq{font-family:Cambria,'Times New Roman',serif;background:#eff4ff;border-radius:6px;padding:10px 14px;text-align:center;overflow-wrap:anywhere;font-size:18px;margin:8px 0}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px;vertical-align:top}th{background:var(--paper)}.scroll{overflow:auto}.footer{font-size:12px;color:var(--muted);margin-top:22px}.stat{background:var(--paper);border:1px solid var(--line);padding:12px;border-radius:9px}.stat b{font-size:23px;display:block}.chart{border:1px solid var(--line);border-radius:9px;padding:10px;margin:12px 0;background:var(--paper)}.chart svg{width:100%;max-width:580px;display:block;margin:auto;background:white;border-radius:5px}.nojs{color:#ad331c}
@media(max-width:520px){main,.top{padding-left:12px;padding-right:12px}.btn{flex:1}.question{font-size:19px}}@media print{.tabs,.buttons,.topic{display:none!important}body{background:white}.card{box-shadow:none}}
</style></head><body><header class="top"><div class="title">Kapanadze AI Socrates</div><div class="sub">English research demonstrator · Four topics · Guided learning, diagnosis and teaching-method research</div><nav class="tabs" aria-label="Workspaces"><button class="tab active" data-view="home">Student</button><button class="tab" data-view="teacher">Lecturer</button><button class="tab" data-view="research">Researcher</button></nav></header><main id="app"><p class="nojs">JavaScript is required to run this interactive program.</p></main>
<script>
'use strict';
const BANK={"ap":[{"id":"P1","stage":"P","comp":"pre","text":"In the sequence 2, 5, 8, 11, … what is the relationship between consecutive terms?","solution":"Each term exceeds the previous term by 3.","kind":"num","expect":[3]},{"id":"P2","stage":"P","comp":"pre","text":"Which number comes next: 2, 5, 8, 11, … ?","solution":"14.","kind":"num","expect":[14]},{"id":"P3","stage":"P","comp":"pre","text":"If a = 4 and b = 3, calculate a + 5b.","solution":"19.","kind":"num","expect":[19]},{"id":"P4","stage":"P","comp":"pre","text":"Solve the equation 3x + 5 = 20.","solution":"x = 5.","kind":"num","expect":[5]},{"id":"P5","stage":"P","comp":"pre","text":"For y = 2x + 1, find y when x = 3.","solution":"y = 7.","kind":"num","expect":[7]},{"id":"I-D","stage":"I","comp":"decl","text":"Observe 4, 7, 10, 13, 16, … . Describe in your own words how one term changes into the next.","solution":"Each term is 3 larger; the common difference is constant.","kind":"text"},{"id":"I-P","stage":"I","comp":"proc","text":"For the sequence 3, 6, 9, 12, … find the common difference d and the sixth term a₆.","solution":"d = 3 and a₆ = 18.","kind":"num","expect":[3,18]},{"id":"I-R","stage":"I","comp":"pers","text":"A student says, “An arithmetic progression always increases.” Do you agree? Test 20, 17, 14, 11, … and explain your check.","solution":"No: the common difference can be negative, as in 20, 17, 14, 11 (d = −3).","kind":"text"},{"id":"II-D","stage":"II","comp":"decl","text":"What does d represent in an arithmetic progression? Can d be negative or zero? Give examples.","solution":"d = aₙ₊₁ − aₙ; it can be negative or zero (for example 5, 5, 5).","kind":"text"},{"id":"II-P1","stage":"II","comp":"proc","text":"For 4, 7, 10, … find a₁₀₀ without listing all preceding terms.","solution":"a₁₀₀ = 4 + 99·3 = 301.","kind":"num","expect":[301]},{"id":"II-P2","stage":"II","comp":"proc","text":"If the first term is a₁ and the common difference is d, express aₙ using only a₁, d and n.","solution":"aₙ = a₁ + (n − 1)d.","kind":"formula","aliases":["a1+(n-1)d","a_1+(n-1)d","a₁+(n-1)d","a₁+d(n-1)"]},{"id":"II-R","stage":"II","comp":"pers","text":"A student writes aₙ = a₁ + nd. Is this correct? How would you test it?","solution":"No: at n = 1 it incorrectly gives a₁ + d, rather than a₁ (unless d = 0).","kind":"text"},{"id":"III-D","stage":"III","comp":"decl","text":"Explain why the formula uses n − 1 rather than n.","solution":"There are n − 1 transitions from term 1 to term n.","kind":"text"},{"id":"III-D2","stage":"III","comp":"decl","text":"Consider the points (1, 4), (2, 7), (3, 10), (4, 13). On what kind of graph do they lie, and what does d represent?","solution":"The points lie on a straight line; d = 3 is its slope when n is the horizontal coordinate.","kind":"text"},{"id":"III-P","stage":"III","comp":"proc","text":"In an arithmetic progression, a₄ = 17 and a₁₀ = 35. Find d and a₁.","solution":"a₁₀ − a₄ = 6d = 18, so d = 3 and a₁ = 8.","kind":"num","expect":[3,8]},{"id":"III-P2","stage":"III","comp":"proc","text":"A stadium has 18 seats in the first row and three more seats in each subsequent row. How many seats are in row 20?","solution":"18 + 19·3 = 75 seats.","kind":"num","expect":[75]},{"id":"III-R","stage":"III","comp":"pers","text":"Reflect on this dialogue: which step was hardest, what helped (numbers, a table, a graph or a formula), and how did you check your answers?","solution":"Identify a difficult step, the strategy that helped, and a concrete check of your result.","kind":"reflect"}],"derivative":[{"id":"P1","stage":"P","comp":"pre","text":"Recall the definition of a function: how many y-values correspond to each x in its domain?","solution":"Exactly one output y for each input x in the domain.","kind":"num","expect":[1]},{"id":"P2","stage":"P","comp":"pre","text":"For y = x², find y when x = −3.","solution":"(−3)² = 9.","kind":"num","expect":[9]},{"id":"P3","stage":"P","comp":"pre","text":"When does ax² + bx + c = 0 have one repeated real root? State the value of its discriminant D.","solution":"The discriminant is D = b² − 4ac = 0.","kind":"num","expect":[0]},{"id":"P4","stage":"P","comp":"pre","text":"How many distinct points does the parabola y = x² share with the x-axis?","solution":"One distinct point, (0,0).","kind":"num","expect":[1]},{"id":"P5","stage":"P","comp":"pre","text":"In the line y = kx + b, which coefficient determines the slope? Write the symbol.","solution":"The coefficient k.","kind":"text"},{"id":"P6","stage":"P","comp":"pre","text":"Factorise x² − 9.","solution":"(x − 3)(x + 3).","kind":"expr"},{"id":"P7","stage":"P","comp":"pre","text":"Given that x = 2 is a root of x³ − 8, which linear factor divides x³ − 8 by the factor theorem?","solution":"The factor is (x − 2).","kind":"text"},{"id":"I-D","stage":"I","comp":"decl","text":"For an arbitrary line y = kx + b, how would you find its intersections with the parabola y = x²? Explain your method.","solution":"Solve x² = kx + b and count its real roots.","kind":"text"},{"id":"I-P1","stage":"I","comp":"proc","text":"How many distinct intersections do y = x² and y = x + 2 have?","solution":"Two distinct intersections, since x² − x − 2 = (x − 2)(x + 1).","kind":"num","expect":[2]},{"id":"I-P2","stage":"I","comp":"proc","text":"How many distinct intersections do y = x² and y = 2x − 1 have?","solution":"One distinct intersection; x² − 2x + 1 = (x − 1)².","kind":"num","expect":[1]},{"id":"I-P3","stage":"I","comp":"proc","text":"How many distinct intersections do y = x² and y = x − 1 have?","solution":"No real intersection; x² − x + 1 has discriminant −3.","kind":"num","expect":[0]},{"id":"I-R","stage":"I","comp":"pers","text":"Compare cases with two, one and no intersections. How does this relate to roots of x² = kx + b? When is the line tangent?","solution":"A double intersection root corresponds to tangency for the parabola; D = 0.","kind":"text"},{"id":"II-D","stage":"II","comp":"decl","text":"At A(a, a²) on the parabola, consider y = a² + k(x − a). Why does this line pass through A for every k, and what does k determine?","solution":"Substitute x = a; k is the line's slope.","kind":"text"},{"id":"II-P1","stage":"II","comp":"proc","text":"Find k such that y = 9 + k(x − 3) is tangent to y = x² at A(3, 9), meaning x = 3 is a double root.","solution":"k = 6; x² − 9 − 6(x − 3) = (x − 3)².","kind":"num","expect":[6]},{"id":"II-P2","stage":"II","comp":"proc","text":"Factorise x² − a² − k(x − a).","solution":"(x − a)(x + a − k).","kind":"expr"},{"id":"II-P3","stage":"II","comp":"proc","text":"Given (x − a)(x + a − k) = 0, what value of k makes x = a a double root? Express k in terms of a.","solution":"k = 2a.","kind":"expr"},{"id":"II-R","stage":"II","comp":"pers","text":"Explain why k = 2a is unique. Why do we exclude the vertical line x = a from this definition of tangency?","solution":"The second factor vanishes at x = a only when k = 2a. Vertical lines intersect at a point but do not satisfy this nonvertical algebraic tangency definition.","kind":"text"},{"id":"III-P1","stage":"III","comp":"proc","text":"For P(x) = x³, find k so that P(x) − [8 + k(x − 2)] is divisible by (x − 2)².","solution":"k = 12; x³ − 8 − 12(x − 2) = (x − 2)²(x + 4).","kind":"num","expect":[12]},{"id":"III-P2","stage":"III","comp":"proc","text":"The line y = 12x − 16 is tangent to y = x³ at A(2, 8). How many distinct intersections does this line have with the cubic?","solution":"Two distinct intersections: x = 2 (double), x = −4 (simple).","kind":"num","expect":[2]},{"id":"III-R1","stage":"III","comp":"pers","text":"For a cubic, why is a double-root criterion for tangency more useful than merely counting intersection points?","solution":"A tangent may meet a cubic at another distinct point; the local double-root factor is the defining property here.","kind":"text"},{"id":"III-P3","stage":"III","comp":"proc","text":"Find the general slope k(a) for P(x) = x³ using x³ − a³ = (x − a)(x² + ax + a²).","solution":"k(a) = 3a².","kind":"expr"},{"id":"III-D1","stage":"III","comp":"decl","text":"By the factor theorem, P(x) − P(a) = (x − a)R(x). What must k equal so that (x − a)² divides (x − a)[R(x) − k]? Why is k unique?","solution":"k = R(a), uniquely.","kind":"text"},{"id":"III-D2","stage":"III","comp":"decl","text":"Each a determines a unique number k(a). Why is a ↦ k(a) a function? Give it a name and state it for x² and x³.","solution":"The unique assignment a ↦ k(a) is the derivative function; 2a for x² and 3a² for x³.","kind":"text"},{"id":"III-P4","stage":"III","comp":"proc","text":"From x² ↦ 2a and x³ ↦ 3a², conjecture and verify algebraically the slope function for P(x) = x⁴.","solution":"k(a) = 4a³.","kind":"expr"},{"id":"III-R2","stage":"III","comp":"pers","text":"Reflect: from repeated roots to tangents and the derivative function, which step was most challenging? What helped, and how did you verify k?","solution":"Explain a genuine difficulty, strategy, and verification (for instance by checking divisibility by (x − a)²).","kind":"reflect"},{"id":"F1","stage":"F","comp":"proc","text":"For f(x) = x² + 3x, determine the tangent slope k at a = 1.","solution":"k(1) = 5.","kind":"num","expect":[5]},{"id":"F2","stage":"F","comp":"proc","text":"Write the derivative (slope) function k(a) of f(x) = x² + 3x.","solution":"k(a) = 2a + 3.","kind":"expr"},{"id":"F3","stage":"F","comp":"decl","text":"Is y = 4x − 4 tangent to y = x²? If so, at which point? Justify your answer.","solution":"Yes. At a = 2, the tangent is y = 4x − 4, since x² − (4x − 4) = (x − 2)².","kind":"text"},{"id":"F4","stage":"F","comp":"pers","text":"Describe a second, independent method to verify your answer to the first final question.","solution":"Verify by algebraic factorisation, computing R(a), or substitution into the double-root criterion.","kind":"text"}],"half":[{"id":"P1","stage":"P","comp":"pre","text":"Find the ordinary derivative (x³)′.","solution":"3x².","kind":"expr"},{"id":"P2","stage":"P","comp":"pre","text":"If D denotes differentiation, calculate D(Dx³).","solution":"D(Dx³) = 6x.","kind":"expr"},{"id":"P3","stage":"P","comp":"pre","text":"D² ∘ D³ means first differentiate three times and then twice. Write D² ∘ D³ = D^? .","solution":"D⁵.","kind":"text"},{"id":"P4","stage":"P","comp":"pre","text":"Simplify x^(5/2) / x^(1/2), assuming x > 0.","solution":"x².","kind":"expr"},{"id":"P5","stage":"P","comp":"pre","text":"Calculate 4^(3/2).","solution":"8.","kind":"num","expect":[8]},{"id":"P6","stage":"P","comp":"pre","text":"Double factorial n!! multiplies integers of the same parity: n(n−2)(n−4)… . Calculate 6!! and 5!!.","solution":"6!! = 6·4·2 = 48; 5!! = 5·3·1 = 15.","kind":"num","expect":[48,15]},{"id":"I-D","stage":"I","comp":"decl","text":"What property should an operator H = D^(1/2) satisfy to be called a half-derivative? Express it using operator composition.","solution":"H ∘ H = D, on an explicitly specified admissible function class.","kind":"text"},{"id":"I-P1","stage":"I","comp":"proc","text":"Differentiation lowers the exponent of x³ by 1. If applying H twice lowers it by 1, by how much should one application of H lower it in our model?","solution":"One half (1/2).","kind":"num","expect":[0.5]},{"id":"I-P2","stage":"I","comp":"proc","text":"Assume H(x³) = c(3)x^? . What exponent does the model predict?","solution":"5/2.","kind":"num","expect":[2.5]},{"id":"I-P3","stage":"I","comp":"proc","text":"Since 1 = x⁰, write the exponent in H(1) = c(0)x^? .","solution":"−1/2.","kind":"num","expect":[-0.5]},{"id":"I-R","stage":"I","comp":"pers","text":"Is the assumption that H lowers an exponent by 1/2 already a theorem, or a construction choice? How can we check consistency?","solution":"It is an ansatz; test composition and the domain conditions.","kind":"text"},{"id":"II-P1","stage":"II","comp":"proc","text":"Apply H twice to x³ using H(x^β) = c(β)x^(β−1/2). Express the result using c(3) and c(5/2).","solution":"H(Hx³) = c(3)c(5/2)x².","kind":"text"},{"id":"II-P2","stage":"II","comp":"proc","text":"H(H(x³)) must equal Dx³ = 3x², so c(3)c(5/2) = 3. In general, what does c(β)c(β−1/2) equal?","solution":"c(β)c(β−1/2) = β, where the operator composition is defined.","kind":"expr"},{"id":"II-D","stage":"II","comp":"decl","text":"The recurrence relates two coefficients. Does it determine c(0) by itself? What else is needed?","solution":"No. A normalisation c₀ must be chosen; the recurrence alone does not fix its numerical value.","kind":"text"},{"id":"II-P3","stage":"II","comp":"proc","text":"At β = 1/2, c(1/2)c(0) = 1/2. Express c(1/2) in terms of c₀ = c(0).","solution":"c(1/2) = 1/(2c₀).","kind":"expr"},{"id":"II-P4","stage":"II","comp":"proc","text":"At β = 1, c(1)c(1/2) = 1. Express c(1) in terms of c₀.","solution":"c(1) = 2c₀.","kind":"expr"},{"id":"II-P5","stage":"II","comp":"proc","text":"Use c(3/2)c(1) = 3/2 and c(2)c(3/2) = 2 to express c(2) in terms of c₀.","solution":"c(3/2) = 3/(4c₀); c(2) = 8c₀/3.","kind":"expr"},{"id":"II-R","stage":"II","comp":"pers","text":"Compare c(0) = c₀, c(1) = 2c₀, c(2) = 8c₀/3, and c(1/2) = 1/(2c₀), c(3/2) = 3/(4c₀). What pattern do you notice?","solution":"Integer coefficients are proportional to c₀, half-integer coefficients to 1/c₀, so factors cancel under composition.","kind":"text"},{"id":"III-P1","stage":"III","comp":"proc","text":"Use the recurrence twice to derive the ratio c(n) / c(n−1).","solution":"c(n)/c(n−1) = 2n/(2n−1).","kind":"expr"},{"id":"III-P2","stage":"III","comp":"proc","text":"Given c(n) = c(n−1)·2n/(2n−1) and c(2) = 8c₀/3, find c(3).","solution":"c(3) = (16/5)c₀.","kind":"expr"},{"id":"III-D1","stage":"III","comp":"decl","text":"Explain why c(n) = c₀(2n)!!/(2n−1)!! for positive integers n.","solution":"Iterate c(n) = [2n/(2n−1)] c(n−1) to obtain the double-factorial formula.","kind":"text"},{"id":"III-D2","stage":"III","comp":"decl","text":"The recurrence does not fix c₀. Why select c₀ = 1/√π to match the Riemann–Liouville half-derivative? Is this forced or a normalisation?","solution":"Choosing c₀ = 1/√π is a normalisation matching the Riemann–Liouville convention; it is not forced by the recurrence.","kind":"text"},{"id":"III-P3","stage":"III","comp":"proc","text":"With c₀ = 1/√π, calculate D^(1/2)x.","solution":"D^(1/2)x = 2√x/√π.","kind":"expr"},{"id":"III-P4","stage":"III","comp":"proc","text":"Verify the composition: D^(1/2)[2x^(1/2)/√π] = ? .","solution":"D^(1/2)[2√x/√π] = 1.","kind":"expr"},{"id":"III-P5","stage":"III","comp":"proc","text":"Since D(1) = 0 and H(1) = c₀x^(−1/2), what must c(−1/2) equal on the stated composition domain?","solution":"c(−1/2) = 0, in the domain where this composition is imposed.","kind":"num","expect":[0]},{"id":"III-P6","stage":"III","comp":"proc","text":"Using linearity and c₀ = 1/√π, find D^(1/2)(x² + x).","solution":"D^(1/2)(x² + x) = 8x^(3/2)/(3√π) + 2√x/√π.","kind":"expr"},{"id":"III-R","stage":"III","comp":"pers","text":"Reflect on the construction from the student's question to the recurrence, double factorials and normalisation. Where did you need most help?","solution":"Name the difficult step, a strategy that helped, and an independent consistency check.","kind":"reflect"},{"id":"F1","stage":"F","comp":"proc","text":"With c₀ = 1/√π, find D^(1/2)x³.","solution":"D^(1/2)x³ = 16x^(5/2)/(5√π).","kind":"expr"},{"id":"F2","stage":"F","comp":"proc","text":"Check D^(1/2)[D^(1/2)x³] = ? .","solution":"D^(1/2)[D^(1/2)x³] = 3x².","kind":"expr"},{"id":"F3","stage":"F","comp":"decl","text":"Find c(5/2) when c₀ = 1/√π.","solution":"c(5/2) = 15√π/16.","kind":"expr"},{"id":"F4","stage":"F","comp":"pers","text":"Describe a second independent way to verify your result for D^(1/2)x³.","solution":"Use the coefficient recurrence and the composition H∘H = D to verify the result.","kind":"text"}],"pyramids":[{"id":"P1","stage":"P","comp":"pre","text":"On which continent is Egypt located?","solution":"Africa.","kind":"text"},{"id":"P2","stage":"P","comp":"pre","text":"Which river runs through Egypt, and why was it so important to its inhabitants?","solution":"The Nile; water, fertile floodplain and transport supported settlement and agriculture.","kind":"text"},{"id":"P3","stage":"P","comp":"pre","text":"Khufu's Great Pyramid dates to about 2560 BCE. Approximately how many years ago was that, counting from 2026 CE?","solution":"Approximately 4,585 years ago, allowing for the approximate dating and no year zero.","kind":"range","min":4400,"max":4700},{"id":"P4","stage":"P","comp":"pre","text":"Who was a pharaoh?","solution":"The ruler of ancient Egypt, with political and religious authority.","kind":"text"},{"id":"P5","stage":"P","comp":"pre","text":"What is a historical source? Give one example.","solution":"Primary evidence from the past, such as an inscription, papyrus, archaeological artefact or tomb.","kind":"text"},{"id":"I-D","stage":"I","comp":"decl","text":"What was the principal purpose of ancient Egyptian pyramids?","solution":"Primarily royal burial and funerary purposes in ancient Egypt, with associated religious meaning.","kind":"text"},{"id":"I-P","stage":"I","comp":"proc","text":"Where are the three famous large pyramids, and which pharaoh commissioned the largest?","solution":"The Giza plateau near Cairo; Khufu's (Cheops') Great Pyramid is the largest.","kind":"text"},{"id":"I-R","stage":"I","comp":"pers","text":"A student says, “Slaves built the pyramids; I saw it in a film.” Is a film sufficient evidence? Which historical sources could help us check?","solution":"A film is not sufficient evidence. Investigate archaeology, workers' settlements and tombs, inscriptions, and contemporary administrative documents.","kind":"text"},{"id":"II-D","stage":"II","comp":"decl","text":"Describe at least two developments from Djoser's Step Pyramid to the smooth-sided pyramids at Giza.","solution":"The Step Pyramid of Djoser, transitional/early true pyramids (e.g. Meidum and the Bent Pyramid), and smooth-sided pyramids at Giza.","kind":"text"},{"id":"II-P","stage":"II","com function reportView(app){const A=summarize(session);app.innerHTML=`<section class="card"><h2>Session report</h2><p>${META[session.topic].title} · ${escapeHTML(session.mode)} · ${escapeHTML(session.study.code||'anonymous')}</p><div class="grid"><div class="stat"><b>${A.score===null?'—':A.score+'%'}</b>Automatic score*</div><div class="stat"><b>${A.first}</b>Correct first responses</div><div class="stat"><b>${A.hints}</b>Socratic prompts</div><div class="stat"><b>${A.review}</b>Answers needing review</div></div><div class="note caution"><b>Interpretation:</b> *Automatic score covers only automatically graded items (${A.graded}/${A.total}). Open-ended responses need human review and are excluded from this percentage. These figures alone do not validate a teaching method.</div><h3>Question-level evidence</h3><div class="scroll"><table><thead><tr><th>Stage / Question</th><th>First attempt</th><th>Help</th><th>Confidence</th><th>Score</th></tr></thead><tbody>${session.results.map((r,i)=>{const q=BANK[session.topic].find(x=>x.id===session.questions[i]);return`<tr><td>${escapeHTML(q.stage+' / '+q.id)}</td><td>${escapeHTML(r.firstVerdict||'—')}</td><td>${r.hints}</td><td>${r.confidence||'—'}</td><td>${r.score==null?'Review':r.score+'/2'}</td></tr>`}).join('')}</tbody></table></div><div class="buttons"><button class="btn primary" id="export">Export this session (CSV)</button><button class="btn soft" id="home">Choose another topic</button><button class="btn soft" id="review">Lecturer notes</button></div><p class="small">Saved only in this browser. Export after every pilot to avoid data loss.</p></section>`;$('#export').onclick=()=>download('Socrates_'+session.topic+'_responses.csv',csv(rowsForSession(session)),'text/csv;charset=utf-8');$('#home').onclick=()=>{session=null;localStorage.removeItem(KEY);render()};$('#review').onclick=()=>goto('teacher')}
function rowsForSession(s){return s.results.map((r,i)=>{const q=BANK[s.topic].find(q=>q.id===s.questions[i]);return{version:s.version,topic:s.topic,student_code:s.study.code,group:s.study.group,teaching_method:s.study.method,timepoint:s.study.timepoint,mode:s.mode,session_start:s.started,question_id:q.id,stage:q.stage,component:q.comp,question:q.text,first_attempt:r.attempts[0]?.answer||'',first_verdict:r.firstVerdict||'',final_answer:r.finalAnswer||r.attempts.at(-1)?.answer||'',verdict:r.status||'',confidence_1_to_5:r.confidence||'',hints:r.hints,attempt_count:r.attempts.length,score_0_to_2:r.score==null?'NEEDS_REVIEW':r.score,teacher_expected:q.solution}})}
function researchView(app){const all=getArchive();const rows=all.flatMap(rowsForSession),grouped={};for(const s of all){const key=[s.topic,s.study.group||'Unassigned',s.study.method,s.study.timepoint,s.mode].join(' / ');(grouped[key]=grouped[key]||[]).push(s)}app.innerHTML=`<section class="card"><h2>Researcher workspace</h2><p>Locally archived sessions: <b>${all.length}</b></p><div class="note caution">No server storage, consent system, participant authentication or multi-device synchronisation is included. The aggregated comparison below is descriptive only. Before field research, validate items and agree on a research protocol.</div><h3>Descriptive grouping</h3><div class="scroll"><table><thead><tr><th>Topic / Group / Method / Stage / Mode</th><th>N</th><th>First responses correct</th><th>Mean automatically graded score</th></tr></thead><tbody>${Object.entries(grouped).map(([k,ss])=>{const sm=ss.map(summarize),scores=sm.map(s=>s.score).filter(v=>v!=null);return`<tr><td>${escapeHTML(k)}</td><td>${ss.length}</td><td>${sm.reduce((a,x)=>a+x.first,0)}</td><td>${scores.length?(scores.reduce((a,x)=>a+x,0)/scores.length).toFixed(1)+'%':'—'}</td></tr>`}).join('')||'<tr><td colspan="4">No completed sessions yet.</td></tr>'}</tbody></table></div><div class="buttons"><button class="btn primary" id="exportAll">Export research data (CSV)</button><button class="btn soft" id="deleteAll">Clear archived sessions</button></div></section>`;$('#exportAll').onclick=()=>rows.length?download('Kapanadze_AI_Socrates_EN_Research.csv',csv(rows),'text/csv;charset=utf-8'):alert('No data yet.');$('#deleteAll').onclick=()=>{if(confirm('Permanently remove locally archived sessions from this browser?')){localStorage.removeItem(ARCH);render()}}}
function teacherView(app){const theory={
 half:`<p><strong>Construction.</strong> On a suitable monomial domain (x &gt; 0), introduce H = D^(1/2) with H∘H = D where composition is well-defined. Assume H(x^β) = c(β)x^(β−1/2).</p><div class="eq">c(β)c(β−1/2) = β</div><p>For nonnegative integer n, c(n) = c₀(2n)!!/(2n−1)!!. On the half-integer chain, c(n−1/2) = (2n−1)!!/[2c₀(2n−2)!!]. Choosing c₀ = 1/√π matches Riemann–Liouville normalisation; the recurrence alone does not uniquely choose it.</p><div class="eq">D^(1/2)x = 2√x/√π ··· D^(1/2)x³ = 16x^(5/2)/(5√π)</div><p><b>Important qualification:</b> Composition and boundary terms depend on the function class. Do not assert that arbitrary fractional operators satisfy a semigroup law on every function.</p>`,
 derivative:`<p><strong>Algebraic–geometric polynomial construction.</strong> For a polynomial P and point A=(a,P(a)), seek a nonvertical line y=P(a)+k(x−a) for which x=a is a double root of the difference.</p><div class="eq">P(x) − [P(a)+k(x−a)] = (x−a)²Q(x)</div><p>From the factor theorem, P(x)−P(a)=(x−a)R(x); therefore k=R(a) is unique. The map a ↦ k(a) constructs the derivative function.</p><div class="eq">x² → k(a)=2a ··· x³ → k(a)=3a²</div><p><b>Teaching principle:</b> move from intersections, to repeated roots, to tangency, and then to the derivative function. For cubic functions, a tangent can intersect the curve again elsewhere; “exactly one intersection” is not a general definition.</p>`,
 ap:`<p>Start with patterns of equal differences. Represent the first, second and n-th terms using the first term a₁ and common difference d.</p><div class="eq">aₙ = a₁ + (n−1)d</div><p>The key conceptual obstacle is confusing the <em>number of terms</em> with the <em>number of transitions</em>. Use n=1 and n=2 as simple checks. Connect the sequence points (n,aₙ) with a straight line of slope d.</p><p>Assess concept recognition, algorithmic use, explanation, counterexamples, and independent verification separately.</p>`,
 pyramids:`<p>Historical reasoning is based on claims and evidence, not on treating films or myths as proof. Egyptian royal pyramids served funerary roles; similar forms in other cultures can serve different purposes.</p><p>Relevant sources include archaeological evidence from the Giza workers' settlements, workers' tombs, inscriptions, the Diary of Merer (Wadi al-Jarf), and depictions of transport by sledges. Exact construction logistics and ramp arrangements remain areas of debate.</p><p>Teach chronological estimation, careful inference, source evaluation, and awareness of uncertainty. Historical dates and block counts are approximations.</p>`};
 app.innerHTML=`<section class="card"><h2>Lecturer workspace</h2><p class="small">Transparent access for demonstration only — this is not protected by authentication.</p><label for="teacherTopic">Topic</label><select id="teacherTopic">${Object.entries(META).map(([k,v])=>`<option value="${k}" ${k===subject?'selected':''}>${v.title}</option>`).join('')}</select><div id="theory" class="theory">${theory[subject]}</div><h3>Question bank and rubric</h3><div id="items">${BANK[subject].map((q,i)=>`<details><summary>${i+1}. [${q.stage}/${q.comp}] ${escapeHTML(q.text)}</summary><p><b>Expected answer / explanation:</b> ${escapeHTML(q.solution)}</p><p><b>Scoring:</b> ${q.kind==='num'||q.kind==='range'?'Numeric response can be checked automatically; check the reasoning independently.':'Open-ended answer may require lecturer review; do not interpret it as an automatically verified result.'}</p><p><b>Socratic prompts:</b> ${[1,2,3].map(n=>escapeHTML(hintFor(q,subject,n))).join(' / ')}</p></details>`).join('')}</div><div class="buttons"><button id="print" class="btn soft">Print lecturer notes</button></div></section>`;
 $('#teacherTopic').onchange=e=>{subject=e.target.value;render()};$('#print').onclick=()=>window.print();function hintFor(q,k,n){const old=session?.topic; // the hint helper reads the active module
 const temp=session;session={topic:k};const h=hint(q,n);session=temp;return h;}
}
function derivativeGraph(){return `<div class="chart"><div class="row spread"><b>Explore the parabola and its tangent</b><span id="slab">a = ${graphA.toFixed(1)}; k = ${(2*graphA).toFixed(1)}</span></div><div id="graph">${graphSVG(graphA)}</div><label for="slope">Choose the contact point a</label><input type="range" id="slope" min="-2" max="2" step="0.1" value="${graphA}"><p class="small">The slope k=2a follows from the double-root criterion for P(x)=x².</p></div>`}
function graphSVG(a){const W=530,H=280,cx=x=>265+x*70,cy=y=>245-y*26;let d='';for(let i=0;i<=150;i++){let x=-3.3+i*6.6/150, y=x*x;d+=(i?'L':'M')+cx(x).toFixed(1)+','+cy(y).toFixed(1)}const x1=-3.5,x2=3.5,s=2*a,b=-a*a;return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Parabola y=x squared and tangent at x=a"><line x1="20" y1="245" x2="510" y2="245" stroke="#9aacbf"/><line x1="265" y1="20" x2="265" y2="265" stroke="#9aacbf"/><path d="${d}" fill="none" stroke="#254da8" stroke-width="2.5"/><line x1="${cx(x1)}" y1="${cy(s*x1+b)}" x2="${cx(x2)}" y2="${cy(s*x2+b)}" stroke="#b94b48" stroke-width="2.2"/><circle cx="${cx(a)}" cy="${cy(a*a)}" r="5" fill="#167652"/><text x="277" y="21" font-size="13" fill="#3d516c">y</text><text x="510" y="238" font-size="13" fill="#3d516c">x</text></svg>`}
render();
